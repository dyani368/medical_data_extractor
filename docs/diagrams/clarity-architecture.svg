<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc">
  <title id="title">Clarity application architecture</title>
  <desc id="desc">Browser goes through Nginx to FastAPI. FastAPI and a separate ingestion worker share PostgreSQL and an asset volume. Redis supplies heartbeat and readiness only. Both services can call an external model provider.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b9cf"/></marker>
    <style>
      .bg{fill:#22272f}.box{fill:#12375a;stroke:#42698a;stroke-width:1.5}.store{fill:#292f3a;stroke:#72859b;stroke-width:1.5}.soft{fill:#273444;stroke:#4b6177;stroke-width:1.5}.line{fill:none;stroke:#a9b9cf;stroke-width:2.5;marker-end:url(#arrow)}.line2{fill:none;stroke:#8196ad;stroke-width:2}.title{fill:#f3f7fc;font:500 28px Arial,sans-serif}.head{fill:#eaf2fd;font:500 20px Arial,sans-serif}.sub{fill:#aebed0;font:16px Arial,sans-serif}.label{fill:#d7e7fa;font:15px Arial,sans-serif}.note{fill:#b7c5d4;font:15px Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1240" height="650" rx="20"/>
  <text class="title" x="42" y="50">Clarity: two processes, one document workspace</text>
  <text class="sub" x="42" y="80">Solid arrows show the main request and processing paths; database and files are shared by API and worker.</text>

  <rect class="box" x="42" y="170" width="190" height="94" rx="14"/>
  <text class="head" x="137" y="207" text-anchor="middle">Browser</text><text class="sub" x="137" y="235" text-anchor="middle">React + TypeScript</text>
  <rect class="box" x="292" y="170" width="190" height="94" rx="14"/>
  <text class="head" x="387" y="207" text-anchor="middle">Nginx</text><text class="sub" x="387" y="235" text-anchor="middle">UI + API proxy</text>
  <rect class="box" x="542" y="170" width="230" height="94" rx="14"/>
  <text class="head" x="657" y="207" text-anchor="middle">FastAPI</text><text class="sub" x="657" y="235" text-anchor="middle">auth · upload · chat</text>
  <rect class="box" x="542" y="367" width="230" height="112" rx="14"/>
  <text class="head" x="657" y="409" text-anchor="middle">Ingestion worker</text><text class="sub" x="657" y="438" text-anchor="middle">parse · redact · index</text>

  <path class="line" d="M232 217 H282"/><path class="line" d="M482 217 H532"/>
  <text class="label" x="505" y="155" text-anchor="middle">HTTP / SSE</text>
  <path class="line" d="M657 264 V357"/>
  <text class="label" x="540" y="315" text-anchor="end">job state in DB</text><text class="label" x="540" y="337" text-anchor="end">private /embed</text>

  <rect class="store" x="850" y="128" width="338" height="106" rx="14"/>
  <text class="head" x="1019" y="168" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="sub" x="1019" y="197" text-anchor="middle">users · jobs · passages · vectors · chats</text>
  <rect class="store" x="850" y="268" width="338" height="100" rx="14"/>
  <text class="head" x="1019" y="307" text-anchor="middle">Private asset volume</text>
  <text class="sub" x="1019" y="337" text-anchor="middle">original PDFs · page/image files</text>
  <rect class="store" x="850" y="401" width="338" height="96" rx="14"/>
  <text class="head" x="1019" y="439" text-anchor="middle">Redis</text>
  <text class="sub" x="1019" y="467" text-anchor="middle">readiness + heartbeat; not the job queue</text>
  <rect class="soft" x="850" y="529" width="338" height="84" rx="14"/>
  <text class="head" x="1019" y="564" text-anchor="middle">External model provider</text>
  <text class="sub" x="1019" y="590" text-anchor="middle">extraction · tools · vision answers</text>

  <path class="line" d="M772 195 H840"/>
  <path class="line" d="M772 423 H800 V318 H840"/>
  <path class="line" d="M772 450 H840"/>
  <path class="line" d="M772 475 H795 V575 H840"/>
  <text class="note" x="42" y="578">Ownership checks happen in FastAPI/SQL, not in the browser or LLM.</text>
  <text class="note" x="42" y="606">The worker is persistent and also shares PostgreSQL; it is not part of the request handler.</text>
</svg>
