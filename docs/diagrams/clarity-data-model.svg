<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 510" role="img" aria-labelledby="title desc">
  <title id="title">Clarity data model and citation IDs</title>
  <desc id="desc">A user owns ingestion jobs, passage rows, and conversations. One upload UUID groups many document passage rows. Each passage has an integer ID used for citations, plus zero or more extraction result rows. No separate source-document table exists.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#acc1d8"/></marker>
    <style>.bg{fill:#22272f}.box{fill:#12375a;stroke:#42698a;stroke-width:1.5}.passage{fill:#204b48;stroke:#5b8c82;stroke-width:1.5}.small{fill:#293343;stroke:#6a829e;stroke-width:1.5}.line{fill:none;stroke:#acc1d8;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#94acc4;stroke-width:2;stroke-dasharray:7 6}.title{fill:#f3f7fc;font:500 28px Arial,sans-serif}.head{fill:#eaf2fd;font:500 20px Arial,sans-serif}.sub{fill:#bdcadd;font:16px Arial,sans-serif}.tag{fill:#d4e5fb;font:500 16px Arial,sans-serif}</style>
  </defs>
  <rect class="bg" width="1240" height="510" rx="20"/>
  <text class="title" x="40" y="48">An upload is not the same thing as a passage</text>
  <text class="sub" x="40" y="76">The important IDs: job/source UUID identifies the uploaded file; integer document ID identifies a citable passage.</text>
  <rect class="box" x="40" y="208" width="190" height="100" rx="14"/>
  <text class="head" x="135" y="246" text-anchor="middle">User</text><text class="sub" x="135" y="277" text-anchor="middle">users.id</text>
  <rect class="box" x="326" y="112" width="282" height="112" rx="14"/>
  <text class="head" x="467" y="151" text-anchor="middle">Upload job</text><text class="sub" x="467" y="180" text-anchor="middle">ingestion_jobs.id = UUID</text>
  <text class="sub" x="467" y="205" text-anchor="middle">original PDF kept as private file</text>
  <rect class="passage" x="692" y="112" width="280" height="112" rx="14"/>
  <text class="head" x="832" y="151" text-anchor="middle">Passages</text><text class="sub" x="832" y="180" text-anchor="middle">documents.id = 51, 52, 53…</text>
  <text class="sub" x="832" y="205" text-anchor="middle">same source_document_id UUID</text>
  <rect class="small" x="1014" y="112" width="184" height="112" rx="14"/>
  <text class="head" x="1106" y="151" text-anchor="middle">Extraction</text><text class="sub" x="1106" y="181" text-anchor="middle">results rows</text>
  <rect class="box" x="326" y="332" width="282" height="112" rx="14"/>
  <text class="head" x="467" y="372" text-anchor="middle">Conversation</text><text class="sub" x="467" y="400" text-anchor="middle">conversations → messages</text>
  <text class="sub" x="467" y="425" text-anchor="middle">owner checked on each read</text>
  <path class="line" d="M230 242 H276 V168 H316"/><path class="line" d="M230 274 H276 V388 H316"/>
  <path class="line" d="M608 168 H682"/><path class="line" d="M972 168 H1004"/>
  <text class="tag" x="832" y="266" text-anchor="middle">Answer citation: [doc:52] refers to one passage</text>
  <text class="sub" x="40" y="483">There is no source_documents table: the UUID is a grouping field on documents rows and the job ID.</text>
</svg>
