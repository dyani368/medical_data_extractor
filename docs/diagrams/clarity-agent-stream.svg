<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">Clarity agent tools and streamed answer</title>
  <desc id="desc">The browser posts a question. The API checks account scope, the model selects bounded tools, the server retrieves owned evidence, and the model generates an answer. The API streams answer fragments, then source metadata and a complete event.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#acc1d8"/></marker>
    <style>.bg{fill:#22272f}.box{fill:#12375a;stroke:#42698a;stroke-width:1.5}.tool{fill:#204b48;stroke:#5b8c82;stroke-width:1.5}.out{fill:#293343;stroke:#6a829e;stroke-width:1.5}.line{fill:none;stroke:#acc1d8;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#94acc4;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.title{fill:#f3f7fc;font:500 28px Arial,sans-serif}.head{fill:#eaf2fd;font:500 20px Arial,sans-serif}.sub{fill:#bdcadd;font:16px Arial,sans-serif}.tag{fill:#d4e5fb;font:500 16px Arial,sans-serif}</style>
  </defs>
  <rect class="bg" width="1240" height="500" rx="20"/>
  <text class="title" x="40" y="48">Tool calling happens before answer streaming</text>
  <text class="sub" x="40" y="76">The agent may choose a tool, but the server controls user scope, limits and actual database reads.</text>
  <rect class="box" x="40" y="170" width="200" height="118" rx="14"/>
  <text class="tag" x="60" y="199">1 · BROWSER</text><text class="head" x="140" y="234" text-anchor="middle">POST question</text><text class="sub" x="140" y="262" text-anchor="middle">JWT + conversation ID</text>
  <rect class="box" x="300" y="170" width="220" height="118" rx="14"/>
  <text class="tag" x="320" y="199">2 · FASTAPI</text><text class="head" x="410" y="234" text-anchor="middle">Check scope</text><text class="sub" x="410" y="262" text-anchor="middle">load owned history</text>
  <rect class="box" x="580" y="170" width="220" height="118" rx="14"/>
  <text class="tag" x="600" y="199">3 · MODEL</text><text class="head" x="690" y="234" text-anchor="middle">Select tool(s)</text><text class="sub" x="690" y="262" text-anchor="middle">max 3 rounds / 6 calls</text>
  <rect class="tool" x="860" y="170" width="320" height="118" rx="14"/>
  <text class="tag" x="880" y="199">4 · SERVER TOOLS</text><text class="head" x="1020" y="234" text-anchor="middle">Retrieve owned evidence</text><text class="sub" x="1020" y="262" text-anchor="middle">search · extraction · nearby chunks</text>
  <path class="line" d="M240 229 H290"/><path class="line" d="M520 229 H570"/><path class="line" d="M800 229 H850"/>
  <path class="dash" d="M1020 288 V328 H690 V298"/>
  <text class="sub" x="818" y="322">evidence returns to model</text>
  <rect class="out" x="300" y="365" width="500" height="86" rx="14"/>
  <text class="head" x="550" y="397" text-anchor="middle">Final answer: SSE text fragments</text>
  <text class="sub" x="550" y="427" text-anchor="middle">then sources event → complete event</text>
  <path class="line" d="M690 338 V355"/><path class="line" d="M300 408 H140 V298"/>
  <text class="sub" x="40" y="481">The delay before the first fragment includes model/tool retrieval time. HTTP 200 alone does not prove the stream completed.</text>
</svg>
