<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
  <title id="title">Clarity hybrid search and answer grounding</title>
  <desc id="desc">An authenticated question searches owned passages using semantic vectors and full text. Reciprocal rank fusion merges candidate ranks, five passages go to the agent, and only IDs of retrieved owned sources can be returned as citation metadata.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#acc1d8"/></marker>
    <style>.bg{fill:#22272f}.box{fill:#12375a;stroke:#42698a;stroke-width:1.5}.merge{fill:#204b48;stroke:#5b8c82;stroke-width:1.5}.end{fill:#293343;stroke:#6a829e;stroke-width:1.5}.line{fill:none;stroke:#acc1d8;stroke-width:2.5;marker-end:url(#arrow)}.title{fill:#f3f7fc;font:500 28px Arial,sans-serif}.head{fill:#eaf2fd;font:500 20px Arial,sans-serif}.sub{fill:#bdcadd;font:16px Arial,sans-serif}.tag{fill:#d4e5fb;font:500 16px Arial,sans-serif}</style>
  </defs>
  <rect class="bg" width="1240" height="520" rx="20"/>
  <text class="title" x="40" y="48">One question, two searches, one evidence set</text>
  <text class="sub" x="40" y="77">Each database query filters by the signed-in user's ID before ranks are merged.</text>

  <rect class="box" x="40" y="214" width="200" height="94" rx="14"/>
  <text class="head" x="140" y="251" text-anchor="middle">Question</text><text class="sub" x="140" y="280" text-anchor="middle">+ authenticated user</text>
  <rect class="box" x="320" y="132" width="240" height="100" rx="14"/>
  <text class="tag" x="340" y="159">SEARCH A</text><text class="head" x="440" y="190" text-anchor="middle">Vector similarity</text><text class="sub" x="440" y="215" text-anchor="middle">semantic matches</text>
  <rect class="box" x="320" y="292" width="240" height="100" rx="14"/>
  <text class="tag" x="340" y="319">SEARCH B</text><text class="head" x="440" y="350" text-anchor="middle">Full-text search</text><text class="sub" x="440" y="375" text-anchor="middle">exact terms and names</text>
  <path class="line" d="M240 252 H270 V182 H310"/><path class="line" d="M240 270 H270 V342 H310"/>
  <rect class="merge" x="650" y="214" width="230" height="94" rx="14"/>
  <text class="head" x="765" y="251" text-anchor="middle">RRF rank fusion</text><text class="sub" x="765" y="280" text-anchor="middle">merge IDs; take top five</text>
  <path class="line" d="M560 182 H605 V247 H640"/><path class="line" d="M560 342 H605 V274 H640"/>
  <rect class="end" x="960" y="132" width="236" height="100" rx="14"/>
  <text class="head" x="1078" y="168" text-anchor="middle">Agent checks evidence</text><text class="sub" x="1078" y="197" text-anchor="middle">answer or abstain</text>
  <rect class="end" x="960" y="292" width="236" height="100" rx="14"/>
  <text class="head" x="1078" y="328" text-anchor="middle">Verified source IDs</text><text class="sub" x="1078" y="357" text-anchor="middle">owned + retrieved only</text>
  <path class="line" d="M880 250 H918 V182 H950"/><path class="line" d="M1078 232 V282"/>
  <text class="sub" x="40" y="453">RRF is not a learned reranker. A returned passage is a candidate, not proof it answers the question.</text>
  <text class="sub" x="40" y="481">The final ID check prevents invented citation IDs; it does not prove every sentence is supported.</text>
</svg>
